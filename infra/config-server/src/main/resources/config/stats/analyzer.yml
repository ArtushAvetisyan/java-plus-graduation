server:
  port: 0

grpc:
  server:
    port: 0

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  kafka:
    topics:
      user-actions: "stats.user-actions.v1"
      events-similarity: "stats.events-similarity.v1"

    group-ids:
      user-actions: "analyzer-user-actions"
      events-similarity: "analyzer-events-similarity"

    listener:
      concurrency: 3
      ack-mode: record