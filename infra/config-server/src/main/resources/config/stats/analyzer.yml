server:
  port: 0

grpc:
  server:
    port: 0

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stats
    username: stats
    password: stats

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 3

app:
  kafka:
    topics:
      user-actions: "stats.user-actions.v1"
      events-similarity: "stats.events-similarity.v1"

    group-ids:
      user-actions: "analyzer-user-actions"
      events-similarity: "analyzer-events-similarity"

    user-actions:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: ru.yandex.practicum.stats.deserialization.UserActionDeserializer

    events-similarity:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.stats.deserialization.EventSimilarityDeserializer