server:
  port: 0

spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          searchLocations:
            - "classpath:config/infra/"
            - "classpath:config/core/"
            - "classpath:config/stats/"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: false