spring:
  application:
    name: analyzer

  config:
    import: "configserver:"

  cloud:
    config:
      fail-fast: true

      retry:
        max-interval: 6000
        initial-interval: 1000
        multiplier: 1.2
        max-attempts: 6

      discovery:
        enabled: true
        serviceId: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

  instance:
    preferIpAddress: true
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"
    leaseRenewalIntervalInSeconds: 10